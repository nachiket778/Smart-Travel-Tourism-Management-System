<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Travel</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-page {
            max-width: 1000px;
            margin: auto;
            padding: 70px 25px;
        }

        .login-box {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1688e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
       <div class="logo">
    <img src="images/logo.png" alt="SmartTravel Logo">
    <span class="brand-text">Smart<span>Travel</span></span>
</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="booking.html">Book Now</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html" class="nav-btn">Register</a></li>
        </ul>
    </nav>
</header>

<section class="login-page">

    <div class="section-title">
        <p>WELCOME BACK</p>
        <h2>Login to Smart Travel</h2>
    </div>

    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>

</section>

<footer>
    <div class="footer-content">

        <div>
            <h2>Smart<span>Travel</span></h2>
            <p>
                Your smart companion for planning and booking
                unforgettable journeys.
            </p>
        </div>

        <div>
            <h3>Quick Links</h3>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="booking.html">Booking</a>
            <a href="login.html">Login</a>
        </div>

    </div>

    <div class="copyright">
        © 2026 Smart Travel & Tourism Management System
    </div>
</footer>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const user = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    fetch("http://localhost:8080/api/users/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })

    .then(response => response.json())

    .then(data => {

        if (data) {

    document.getElementById("message").innerHTML =
        "✅ Login successful! Welcome to SmartTravel";

    localStorage.setItem("loggedInUser", JSON.stringify(data));

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);

         } else {

            document.getElementById("message").innerHTML =
                "❌ Invalid email or password.";

        }

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message").innerHTML =
            "❌ Login failed. Please start the Java backend.";

    });

});

</script>

</body>
</html>
